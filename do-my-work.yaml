version: 1

translation:
  rules:
    - match: "README.md"
      profile: technical
      translated_document_header: |
        # GNWT-Garrigue-X-en : message in a bottle, set adrift
        > ✨ This README from  project [**GNWT-Garrigue-X**](https://github.com/AlainCo/GNWT-Garrigue-X) was translated automatically with [**Do-My-Work**](https://github.com/AlainCo/do-my-work) — a tool designed to make projects speak globally.

        > ⚠️ Minor imperfections may remain — feel free to open an issue if something seems unclear.

        > ⚠️ Like a message in a bottle set adrift, it may not be perfect — but hopefully, it still finds you.
    - match: "**/*.md"
      profile: technical
    - match: "work/**/*"
      exclude: true
    - match: "docs/**/*"
      exclude: true
    - match: "tools/**/*"
      exclude: true
reference_index:
  rules:
    - match: "work/**/*"
      exclude: true
    - match: "docs/**/*"
      exclude: true
    - match: "tools/**/*"
      exclude: true
spurious:
  rules:
    - match: "**/*.review.html"
      exclude: true
    - match: "**/*.index.md"
      exclude: true
    - match: "**/*.references.md"
      exclude: true
    - match: "**/.gitignore"
      exclude: true
    - match: ".git/**/*"
      exclude: true
    - match: "docs/**/*"
      exclude: true
    - match: "tools/**/*"
      exclude: true
