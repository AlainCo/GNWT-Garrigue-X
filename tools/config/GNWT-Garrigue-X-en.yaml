input_dir: ../GNWT-Garrigue-X
output_dir: ../GNWT-Garrigue-X-en
data_dir: ../GNWT-Garrigue-X-en/work/data
reference_index:
  max_pdf_bytes: 8388608
  preview_max_text_chars: 2400
  preview_max_lines: 8
translation_review:
  translated_first: true
file_selection:
  default_action: exclude
  rules:
    - match: "**/*.md"
      action: include
    - match: "**/*.review.html"
      action: exclude
    - match: "**/*.index.md"
      action: exclude
    - match: "**/*.references.md"
      action: exclude
resource_selection:
  default_action: exclude
  rules:
    - match: "**/*.url"
      action: include
    - match: "**/*.jpeg"
      action: include
    - match: "**/*.jpg"
      action: include
    - match: "**/*.pdf"
      action: include
spurious_detection:
  default_action: include
  rules:
    - match: "**/*.review.html"
      action: exclude
    - match: "**/*.index.md"
      action: exclude
    - match: "**/*.references.md"
      action: exclude
    - match: ".git/**/*"
      action: exclude
    - match: ".gitignore"
      action: exclude
llm:
  translator:
    basebackend-ollamamock:
      api: ollama
      url: http://127.0.0.1:11434
      credential: ${env:LLM_API_KEY}
    basemodel-mock:
      base:
        - basebackend-ollamamock
      model: mock-ollama
    basebackend-llamacpp:
      api: openai
      url: http://127.0.0.1:8000/v1
    basemodel-huger:
      base:
        - basebackend-llamacpp
      model: Mistral-Small-3.2-24B-Instruct-2506-UD-Q5_K_XL
      timeout_seconds: 2100
    basemodel-huge:
      base:
        - basebackend-llamacpp
      model: Mistral-Small-3.2-24B-Instruct-2506-Q4_K_M
      timeout_seconds: 900
    basemodel-large:
      base:
        - basebackend-llamacpp
      model: Ministral-3-14B-Instruct-2512-Q4_K_M
      timeout_seconds: 900
    basemodel-medium:
      base:
        - basebackend-llamacpp
      model: Ministral-3-8B-Instruct-2512-Q5_K_M
      timeout_seconds: 600
    basemodel-small:
      base:
        - basebackend-llamacpp
      model: Ministral-3-3B-Instruct-2512-Q4_K_M
      timeout_seconds: 300
    basestyle-generic:
      temperature: 0.0
      max_pre_context_bytes: 300
      max_post_context_bytes: 300
      max_input_fragment_bytes: 1000
      max_total_text_bytes: 1500
      system_prompt: |
        **ROLE**: You are a **strict** French → English automatic translator. **Only translate**.
        
        **ABSOLUTE RULES**:
        1. **Translate ONLY** the content of `SOURCE TEXT`. 
          * **NEVER** output the `SOURCE TEXT` tags themselves.
        2. Use `PREVIOUS CONTEXT` and `FOLLOWING CONTEXT` **only** to resolve ambiguities (e.g., pronouns, technical terms). **Do not translate them or include them** in the output.
        3. **Formatting**:
            * Keep **intact**: linefeed, Markdown, Mermaid, HTML tags, code blocks (\`\`\`).
            * Keep **intact**: tables, and figures (except labels to be translated).
            * keep **intact**: programming code and formulas
            * keep **intact**: URL, references, and Markdown links.
              * eg: [Un navire bleu](vaisseaux/un-navire-bleu.md)  → [A blue ship](vaisseaux/un-cheval-bleu.md)
              * eg: https://un-site-francais.fr/une-page-sur-la-marine.html#chapitre1 → https://un-site-francais.fr/une-page-sur-la-marine.html#chapitre1
        4. **Output**:
            * **ONLY** the translation in Markdown, **with no additions** (no additional tags, comments, explanations, variants, or greetings).
            
        **STYLE GUIDELINES**:
        * Give **priority** to the guidance in the `TRANSLATION HINTS` section.
        * **Tone**: Educational and fluent **by default**, but **adapt to the original register**:
          * **Technical text** → Precise terminology (e.g., "API" → "API", not "application programming interface").
          * **Emotional/literary text** → Cultural sensitivity (e.g., "joie de vivre" → "joie de vivre" if untranslatable).
          * **Colloquial/vulgar/slang text** → **Equally raw** equivalent in English (e.g., "putain" → "fucking").
        * **Never soften** the text (e.g., "j’ai la flemme" → "I can’t be arsed", not "I’m tired").

      user_prompt: |
        [TRANSLATION HINTS]
        ${translation_hints}
        [/TRANSLATION HINTS]

        [PREVIOUS CONTEXT]
        ${pre_context}
        [/PREVIOUS CONTEXT]

        [SOURCE TEXT]
        ${input_fragment}
        [/SOURCE TEXT]

        [FOLLOWING CONTEXT]
        ${post_context}
        [/FOLLOWING CONTEXT]
      translated_document_footer: "> ✨ Translated automatically with [**Do-My-Work**](https://github.com/AlainCo/do-my-work) — a tool designed to make projects speak globally."
      translated_document_header: "> ✨ Translated automatically with [**Do-My-Work**](https://github.com/AlainCo/do-my-work) — profile: generic."         
    basestyle-technical:
      base:
        - basestyle-generic
      temperature: 0.0
      translated_document_header: "> ✨ Translated automatically with [**Do-My-Work**](https://github.com/AlainCo/do-my-work) — profile: technical."         
    basestyle-romantic:
      base:
        - basestyle-generic
      temperature: 0.0
      system_prompt: |
        **ROLE**: You are a **strict** French → English automatic translator. **Only translate**.
        
        **ABSOLUTE RULES**:
        1. **Translate ONLY** the content of `SOURCE TEXT`. 
          * **NEVER** output the `SOURCE TEXT` tags themselves.
        3. **Formatting**:
            * Keep **intact**: linefeed, Markdown, Mermaid, HTML tags, code blocks (\`\`\`).
            * Keep **intact**: tables, and figures (except labels to be translated).
            * keep **intact**: programming code and formulas
            * keep **intact**: URL, references, and Markdown links.
              * eg: [Un navire bleu](vaisseaux/un-navire-bleu.md)  → [A blue ship](vaisseaux/un-cheval-bleu.md)
              * eg: https://un-site-francais.fr/une-page-sur-la-marine.html#chapitre1 → https://un-site-francais.fr/une-page-sur-la-marine.html#chapitre1
        4. **Output**:
            * **ONLY** the translation in Markdown, **with no additions** (no additional tags, comments, explanations, variants, or greetings).

        **STYLE GUIDELINES**:
        * Give **priority** to the guidance in the `TRANSLATION HINTS` section.
        * **Tone**: Romantic and emotional **by default**, but **adapt to the original register**:
          * **Technical text** → Precise terminology (e.g., "API" → "API", not "application programming interface").
          * **Emotional/literary text** → Cultural sensitivity (e.g., "joie de vivre" → "joie de vivre" if untranslatable).
          * **Colloquial/vulgar/slang text** → **Equally raw** equivalent in English (e.g., "putain" → "fucking").
        * **Never soften** the text (e.g., "j’ai la flemme" → "I can’t be arsed", not "I’m tired").
      translated_document_header: "> ✨ Translated automatically with [**Do-My-Work**](https://github.com/AlainCo/do-my-work) — profile: romantic."             
    technical:
      base:
        - basemodel-huger
        - basestyle-technical
    romantic:
      base:
        - basemodel-huger
        - basestyle-romantic
